name: nexus_app
description: "NEXUS - Safety Module for Two-Wheeled Vehicles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  wifi_scan: ^0.4.0
  permission_handler: ^11.0.0
  # Backend & Authentification
  supabase_flutter: ^2.8.0

  # Navigation
  go_router: ^14.8.0

  # Splash animé
  animated_splash_screen: ^1.3.0
  page_transition: ^2.1.0

  # Icons
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1

  # Notifications
  flutter_local_notifications: ^17.1.0

  # Session (inactivité)
  shared_preferences: ^2.2.3

  # Launcher
  url_launcher: ^6.3.0

  # IoT & Scan
  wifi_iot: ^0.3.19

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_nexus.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Ton magnifique logo cercle violet-rose-orange
  assets:
    - assets/images/
